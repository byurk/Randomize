---
name: slopehtest
title: Slope (SLR) - Hypothesis Test
menuGroup: Randomize
version: '1.0.0'
jas: '1.2'

description:
    main: |
        Permutation test for slope.
    R:
        dontrun: false
        usage: |
            data('faithful')

            slopehtest(dep = eruptions, indep = waiting, data = faithful)

completeWhenFilled: true

formula:
    dep:
        from: lhs
        required: true
    indep:
        from: rhs
        subset: 1

options:
    - name: data
      type: Data
      description:
          R: the data as a data frame

    - name: dep
      title: Dependent Variable
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      rejectInf: false
      description:
          ui: >
            the dependent variable
          R: >
            the dependent variable (not necessary when using a formula, see
            the examples)

    - name: indep
      title: Independent Variable
      type: Variable
      suggested:
        - continuous
      permitted:
        - numeric
      description:
          ui: >
            the independent variable.
          R: >
            the independent variable (not necessary when
            using a formula, see the examples)

    - name: hypothesis
      title: Alternative hypothesis
      type: List
      options:
        - name: notequal
          title: "β ≠ 0"
        - name: greater
          title: "β > 0"
        - name: less
          title: "β < 0"
      default: notequal
      description:
          ui: >
            the alternative hypothesis.
          R: >
            `'notequal'` (default), `'greater'` or
            `'less'`, the alternative hypothesis; slope not equal to 0, slope greater than 0, or slope less than 0

    - name: coef
      title: Model Coefficients
      type: Bool
      default: false
      description:
          ui: >
            provide linear model coefficients.
          R: >
            `TRUE` or `FALSE` (default), provide model coefficients

    - name: modelfit
      title: Correlation, R²
      type: Bool
      default: false
      description:
          ui: >
            provide correlation and R^2.
          R: >
            `TRUE` or `FALSE` (default), provide correlation and R^2

    - name: plots
      title: Plot
      type: Bool
      default: false
      description:
          ui: >
            provide scatter plot with regression line.
          R: >
            `TRUE` or `FALSE` (default), provide scatter plot with regression line.

    - name: reps
      title: Number of simulated samples
      type: Integer
      min: 1
      default: 100
      description:
          R: >
            a number (default: 100), the number of parametric bootstraps

    - name: dotHist
      title: Plot slopes
      type: List
      options:
        - title: Dot plot
          name:  dotplot
        - title: Histogram
          name:  histogram
      default: dotplot

    - name: showCounts
      title: Show counts on plot
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), whether to print the count above
            each bar or dot stack of the simulation plot

    - name: seedBool
      title: Seed random number generator
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), whether to seed the random number generator

    - name: rngSeed
      title: Seed
      type: Number
      default: 8675309
      description:
          R: >
            a number (default: 8675309), for seeding the random number generator
...