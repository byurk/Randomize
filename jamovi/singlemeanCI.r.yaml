---
name:  SingleMeanCI
title: Single Mean - Confidence Interval
jrs:   '1.1'

items:
    - name:  textSample
      title: Original sample
      type:  Preformatted

    - name: summtable
      title: Summary Statistics
      type: Table
      description: a table of descriptives
      clearWith:
          - resp

      columns:
          - name: var
            title: ""
            type: text
            combineBelow: true

          - name: num
            title: N
            type: integer

          - name: mean
            title: Mean
            type: number

          - name: med
            title: Median
            type: number

          - name: sd
            title: SD
            type: number

    - name:  textSimulations
      title: Simulated samples
      type:  Preformatted


    - name: Plot
      title: Bootstrap Means
      type: Image
      description: a plot showing the distribution of the means
      renderFun: .bootPlot
      width: 400
      height: 350
      clearWith:
          - resp
          - confLevel
          - ciType
          - reps
          - seedBool
          - rngSeed
          - dotHist
          - showCounts

    - name: simtable
      title: Simulation Results
      type: Table
      description: a table of the simulation results
      clearWith:
          - resp
          - confLevel
          - ciType
          - reps
          - seedBool
          - rngSeed


      columns:
          - name: reps
            title: Reps
            type: integer

          - name: obsMean
            title: Mean
            type: number

          - name: cil
            title: Lower
            superTitle: Confidence Interval
            type: number

          - name: ciu
            title: Upper
            superTitle: Confidence Interval
            type: number
...
