---
name:  modelBased
title: Model-Based Inference
menuGroup: Randomize
version: '1.1.0'
jas: '1.2'

options:
    - name: distro
      title: Distribution
      type: List
      options:
        - title: Standard normal (Z)
          name:  ndistro
        - title: t
          name:  tdistro
        - title: Chi-square
          name:  chisq
        - title: F
          name:  fdistro
      default: ndistro
      description:
          R: >
            `'ndistro'` (default), `'tdistro'`, `'chisq'`, or `'fdistro'`,
            the reference distribution

    - name: dF
      title: Degrees of freedom
      type: Integer
      min: 1
      default: 30
      description:
          R: >
            an integer (default: 30), degrees of freedom for the t or
            chi-square distribution; numerator degrees of freedom for F

    - name: dF2
      title: Denominator df (F only)
      type: Integer
      min: 1
      default: 30
      description:
          R: >
            an integer (default: 30), denominator degrees of freedom for
            the F distribution

    - name: areaBool
      title: Calculate area (p-value)
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), whether to calculate area

    - name: obsStat
      title: Observed value
      type: Number
      default: 0.0
      description:
          R: >
            a number (default: 0.0), the observed value of the statistic

    - name: tail
      title: Tail
      type: List
      options:
        - title: Right
          name:  right
        - title: Left
          name:  left
        - title: Both
          name:  both
      default: right
      description:
          R: >
            `'right'` (default), `'left'`, or `'both'`; ignored for the
            chi-square and F distributions, which always use the right tail

    - name: CIBool
      title: Calculate CI multiplier
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), whether to calculate CI multiplier
            (standard normal and t distributions only)

    - name: confLevel
      title: Confidence level
      type: Number
      default: 95
      min: 0
      max: 100
      description:
          R: >
            a number (default: 95), the confidence level
...
