---
name:  modelBased
title: Model-Based Inference
menuGroup: Randomize
version: '1.0.0'
jas: '1.2'

options:
    - name: distro
      title: Distribution
      type: List
      options:
        - title: Use standard normal distribution
          name:  ndistro
        - title: Use T distribution
          name:  tdistro
      default: ndistro

    - name: dF
      title: Degrees of freedom (T)
      type: Integer
      min: 1
      default: 30
      description:
          R: >
            a number (default: 30), degrees of freedom for T distro

    - name: areaBool
      title: Calculate area (p-value)
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), whether to calculate area

    - name: obsStat
      title: Observed value (Z or T)
      type: Number
      default: 0.0
      description:
          R: >
            a number (default: 0.0), the observed value of Z or T

    - name: tail
      title: Tail
      type: List
      options:
        - title: Right
          name:  right
        - title: Left
          name:  left
        - title: Both
          name:  both
      default: right

    - name: CIBool
      title: Calculate CI multiplier
      type: Bool
      default: false
      description:
          R: >
            `TRUE` or `FALSE` (default), whether to calculate p-value

    - name: confLevel
      title: Confidence level
      type: Number
      default: 95
      min: 0
      description:
          R: >
            a number (default: 95), the confidence level
...
