title: Single Mean - Confidence Interval
name: SingleMeanCI
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variable
        children:
          - type: VariablesListBox
            name: resp
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: confLevel
        format: number
        suffix: "%"
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: ciType
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: reps
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: dotHist
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: seedBool
        children:
          - type: TextBox
            name: rngSeed
            format: number
            enable: (seedBool)
