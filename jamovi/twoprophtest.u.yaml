title: Two Proportions - Hypothesis Test
name: TwoPropHTest
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Rows
        children:
          - type: VariablesListBox
            name: rows
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Columns
        children:
          - type: VariablesListBox
            name: cols
            maxItemCount: 1
            isTarget: true
      - type: TargetLayoutBox
        label: Counts (optional)
        children:
          - type: VariablesListBox
            name: counts
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: compare
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: hypothesis
  - type: CollapseBox
    label: Cells
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        stretchFactor: 1
        children:
          - type: LayoutBox
            cell:
              column: 0
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Counts
                fitToGrid: true
                children:
                  - type: CheckBox
                    name: obs
                  - type: CheckBox
                    name: exp
          - type: LayoutBox
            cell:
              column: 1
              row: 0
            stretchFactor: 1
            children:
              - type: Label
                label: Percentages
                fitToGrid: true
                cell:
                  column: 1
                  row: 0
                children:
                  - type: CheckBox
                    name: pcRow
                  - type: CheckBox
                    name: pcCol
                  - type: CheckBox
                    name: pcTot
  - type: CollapseBox
    label: Simulations
    stretchFactor: 1
    collapsed: true
    children:
      - type: LayoutBox
        margin: large
        children:
          - type: TextBox
            name: reps
            format: number
      - type: LayoutBox
        margin: large
        children:
          - type: ComboBox
            name: dotHist
          - type: CheckBox
            name: showCounts
      - type: LayoutBox
        margin: large
        children:
          - type: CheckBox
            name: seedBool
            children:
              - type: TextBox
                name: rngSeed
                width: large
                format: number
                enable: (seedBool)
