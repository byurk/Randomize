---
name:  modelBased
title: Model-Based Inference
jrs:   '1.1'

items:
    - name: Plot
      title: Probability density function
      type: Image
      description: a plot showing the area under probability density curve
      renderFun: .areaPlot
      width: 450
      height: 250
      visible: (areaBool)
      clearWith:
          - distro
          - dF
          - dF2
          - areaBool
          - obsStat
          - tail

    - name: areaTable
      title: Shaded area (p-value)
      type: Table
      description: table with area under probability density curve
      visible: (areaBool)
      clearWith:
          - distro
          - dF
          - dF2
          - areaBool
          - obsStat
          - tail

      columns:
          - name: obsStat
            title: Observed value
            type: number

          - name: df
            title: df
            type: integer
            visible: (distro:tdistro || distro:chisq)

          - name: df1
            title: df₁
            type: integer
            visible: (distro:fdistro)

          - name: df2
            title: df₂
            type: integer
            visible: (distro:fdistro)

          - name: area
            title: Area (p-value)
            type: number
            format: zto,pvalue

    - name: multTable
      title: CI multiplier (critical value)
      type: Table
      description: a table with CI multiplier
      visible: (CIBool)
      clearWith:
          - distro
          - dF
          - CIBool
          - confLevel

      columns:
          - name: confLev
            title: Confidence level (%)
            type: number

          - name: df
            title: df
            type: integer
            visible: (distro:tdistro)

          - name: critVal
            title: Multiplier
            type: number
            format: zto

...
