---
name: multimeanhtest
title: Multiple Means - Hypothesis Test
jrs: '1.0'

items:
    - name: desc
      title: Group Descriptives
      type: Table
      description: a table containing the group descriptives
      rows: 0
      visible: (desc)
      clearWith:
        - group
        - vars

      columns:
        - name: dep
          title: ""
          type: text
          combineBelow: true

        - name: group
          title: ""
          type: text

        - name: num
          title: "N"
          type: integer

        - name: mean
          title: Mean
          type: number

        - name: median
          title: Median
          type: number

        - name: sd
          title: SD
          type: number

    - name: descplot
      title: Descriptive Plots
      type: Array
      description: an array of groups of plots
      items: (vars)
      clearWith:
        - group
      template:
          title: $key
          type: Group
          items:
            - name: desc
              type: Image
              description: descriptives plot
              visible: (plots)
              renderFun: .descplot
              clearWith: []

    - name: simplot
      title: Randomized F statistics
      type: Image
      description: a plot showing the distribution of F statistics
      renderFun: .permPlot
      width: 400
      height: 350
      clearWith:
          - group
          - vars
          - reps
          - rngSeed
          - seedBool
          - dotHist
          - showCounts

    - name: htest
      title: Multiple Means - Hypothesis Test
      description: a table containing the permutation test results
      type: Table
      rows: (vars)
      clearWith:
        - group
        - vars
        - rngSeed
        - seedBool
        - reps

      columns:
        - name: var
          title: ""
          content: ($key)
          type: text
          combineBelow: true

        - name: oF
          title: Observed F
          type: number

        - name: reps
          title: Reps
          type: integer

        - name: p
          title: p
          type: number
          format: zto,pvalue