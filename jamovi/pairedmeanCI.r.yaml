---
name: pairedmeanCI
title: Paired Means - Confidence Interval
jrs: '1.0'

items:
    - name: desc
      title: Descriptives
      type: Table
      description: a table containing the descriptives
      visible: (desc)
      clearWith:
          - pairs

      columns:
        - name: name
          title: ""
          content: .
          type: text

        - name: num
          title: "N"
          type: integer

        - name: m
          title: Mean
          type: number

        - name: med
          title: Median
          type: number

        - name: sd
          title: SD
          type: number

    - name: descplot
      title: Descriptive Plots
      type: Array
      description: descriptives plot
      items: (pairs)
      template:
          type: Group
          items:
            - name: desc
              type: Image
              description: descriptives plot
              visible: (plots)
              renderFun: .descplot
              clearWith: []

    - name: simplot
      title: Bootstrap mean differences
      type: Image
      description: a plot showing the distribution of mean differences
      renderFun: .bootPlot
      width: 400
      height: 350
      clearWith:
          - pairs
          - confLevel
          - ciType
          - reps
          - rngSeed
          - seedBool
          - dotHist
          - showCounts

    - name: CITable
      title: Paired Means - Confidence Interval
      description: a table containing the bootstrap CI results
      type: Table
      rows: (pairs)
      clearWith:
        - rngSeed
        - seedBool
        - reps

      columns:
        - name: var1
          title: ""
          type: text
          combineBelow: true

        - name: var2
          title: ""
          type: text
          combineBelow: true

        - name: reps
          title: Reps
          type: integer

        - name: obsDiff
          title: Observed mean difference
          type: number

        - name: cil
          title: Lower
          superTitle: Confidence Interval
          type: number
          format: zto

        - name: ciu
          title: Upper
          superTitle: Confidence Interval
          type: number
          format: zto