---
name: pairedmeanhtest
title: Paired Means - Hypothesis Test
jrs: '1.0'

items:
    - name: desc
      title: Descriptives
      type: Table
      description: a table containing the descriptives
      visible: (desc)
      clearWith:
          - pairs

      columns:
        - name: name
          title: ""
          content: .
          type: text

        - name: num
          title: "N"
          type: integer

        - name: m
          title: Mean
          type: number

        - name: med
          title: Median
          type: number

        - name: sd
          title: SD
          type: number

    - name: descplot
      title: Descriptive Plots
      type: Array
      description: descriptives plot
      items: (pairs)
      template:
          type: Group
          items:
            - name: desc
              type: Image
              description: descriptives plot
              visible: (plots)
              renderFun: .descplot
              clearWith: []

    - name: simplot
      title: Randomized mean differences
      type: Image
      description: a plot showing the distribution of mean differences
      renderFun: .permPlot
      width: 400
      height: 350
      clearWith:
          - pairs
          - hypothesis
          - reps
          - rngSeed
          - seedBool
          - dotHist
          - showCounts

    - name: htest
      title: Paired Means - Hypothesis Test
      description: a table containing the permutation test results
      type: Table
      rows: (pairs)
      clearWith:
        - hypothesis
        - rngSeed
        - seedBool
        - reps

      columns:
        - name: var1
          title: ""
          type: text
          combineBelow: true

        - name: var2
          title: ""
          type: text
          combineBelow: true

        - name: md
          title: Observed mean difference
          type: number

        - name: reps
          title: Reps
          type: integer

        - name: p
          title: p
          type: number
          format: zto,pvalue