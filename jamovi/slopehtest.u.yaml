name:  slopehtest
title: Slope (SLR) - Hypothesis Test
jus:   '2.0'
compilerMode: tame
children:
  - type: VariableSupplier
    suggested:
      - continuous
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: dep
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: indep
            isTarget: true
            maxItemCount: 1
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
            column: 0
            row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Hypothesis
            children:
              - type: RadioButton
                name: hypothesis_notequal
                optionName: hypothesis
                optionPart: notequal
                label: "β ≠ 0"

              - type: RadioButton
                name: hypothesis_greater
                optionName: hypothesis
                optionPart: greater
                label: "β > 0"

              - type: RadioButton
                name: hypothesis_less
                optionName: hypothesis
                optionPart: less
                label: "β < 0"

          - type: Label
            label: Simulations
            children:
              - type: LayoutBox
                margin: large
                children:
                - type: TextBox
                  name: reps
                  format: number
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: dotHist
              - type: CheckBox
                name: showCounts
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: seedBool
                children:
                  - type: TextBox
                    name: rngSeed
                    format: number
                    enable: (seedBool)

      - type: LayoutBox
        cell:
            column: 1
            row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Linear Model
            children:
              - type: CheckBox
                name: coef
                label: Model Coefficients

              - type: CheckBox
                name: modelfit
                label: Correlation, R²

              - type: CheckBox
                name: plots
                label: Plot