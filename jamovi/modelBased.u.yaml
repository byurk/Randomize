title: Model-Based Inference
name: modelBased
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: distro
      - type: TextBox
        name: dF
        format: number
        enable: (distro:tdistro || distro:chisq || distro:fdistro)
      - type: TextBox
        name: dF2
        format: number
        enable: (distro:fdistro)
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: areaBool
        children:
          - type: TextBox
            name: obsStat
            format: number
            enable: (areaBool)
          - type: ComboBox
            name: tail
            enable: (areaBool && (distro:ndistro || distro:tdistro))
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: CIBool
        enable: (distro:ndistro || distro:tdistro)
        children:
          - type: TextBox
            name: confLevel
            format: number
            suffix: '%'
            enable: (CIBool && (distro:ndistro || distro:tdistro))
