name:  twomeanhtest
title: Two Means - Hypothesis Test
jus:   '2.0'
compilerMode: tame
children:
  - type: VariableSupplier
    suggested:
      - continuous
      - nominal
      - ordinal
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: vars
            isTarget: true
            maxItemCount: 1
      - type: TargetLayoutBox
        children:
          - type: VariablesListBox
            name: group
            isTarget: true
            maxItemCount: 1
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: LayoutBox
        cell:
            column: 0
            row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Hypothesis
            children:
              - type: RadioButton
                name: hypothesis_different
                optionName: hypothesis
                optionPart: different
                label: "Group 1 ≠ Group 2"

              - type: RadioButton
                name: hypothesis_oneGreater
                optionName: hypothesis
                optionPart: oneGreater
                label: "Group 1 > Group 2"

              - type: RadioButton
                name: hypothesis_twoGreater
                optionName: hypothesis
                optionPart: twoGreater
                label: "Group 1 < Group 2"

          - type: Label
            label: Simulations
            children:
              - type: LayoutBox
                margin: large
                children:
                - type: TextBox
                  name: reps
                  format: number
          - type: LayoutBox
            margin: large
            children:
              - type: ComboBox
                name: dotHist
              - type: CheckBox
                name: showCounts
          - type: LayoutBox
            margin: large
            children:
              - type: CheckBox
                name: seedBool
                children:
                  - type: TextBox
                    name: rngSeed
                    format: number
                    enable: (seedBool)

      - type: LayoutBox
        cell:
            column: 1
            row: 0
        stretchFactor: 1
        children:
          - type: Label
            label: Descriptive Statistics
            children:
              - type: CheckBox
                name: desc
                label: Descriptives

              - type: CheckBox
                name: plots
                label: Descriptives plots