title: Single Proportion - Hypothesis Test
name: SinglePropHTest
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variable
        children:
          - type: VariablesListBox
            name: resp
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: areCounts
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: testValue
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: alt
  - type: LayoutBox
    margin: large
    children:
      - type: TextBox
        name: reps
        format: number
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: dotHist
      - type: CheckBox
        name: showCounts
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: seedBool
        children:
          - type: TextBox
            name: rngSeed
            width: large
            format: number
            enable: (seedBool)
